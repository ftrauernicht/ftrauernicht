name: Social preview cards

# The cards cannot be rendered here, and that is not a gap in the runner. The design
# asks for Georgia and Segoe UI, both of which ship with Windows and with nothing else,
# and Java does not complain about a missing family: it hands back a default face. A run
# on 2026-10-16 did exactly that and rewrote all eight cards in the wrong typeface, with
# different line breaks and a smaller title, without a single warning. SocialPreview now
# refuses to render when a face is missing, so it cannot happen again unnoticed.
#
# What a runner can check is that the folder stays consistent: every row in cards.tsv has
# a card, every card has a row, and the generator still compiles. That is the mistake that
# actually happens, which is a row added and the render forgotten.

on:
  push:
    branches: [main]
    paths:
      - tools/social-preview/**
      - .github/workflows/social-preview.yml
  pull_request:
    paths:
      - tools/social-preview/**
      - .github/workflows/social-preview.yml
  workflow_dispatch: {}

# Reading is all this needs. Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    name: Check the cards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: The generator still compiles
        run: javac --release 21 -d "$(mktemp -d)" tools/social-preview/SocialPreview.java

      - name: Every row has a card and every card has a row
        run: |
          # No -e: both halves run, so one pass names every problem rather than the first.
          set -uo pipefail
          cd tools/social-preview
          status=0

          while IFS=$'\t' read -r name rest; do
            case "$name" in ''|'#'*) continue ;; esac
            if [ ! -f "cards/$name.png" ]; then
              echo "::error::cards.tsv has a row for $name but cards/$name.png is missing. Run render.sh on a machine that has Georgia and Segoe UI."
              status=1
            fi
          done < cards.tsv

          for f in cards/*.png; do
            n=$(basename "$f" .png)
            if ! cut -f1 cards.tsv | grep -qxF "$n"; then
              echo "::error::cards/$n.png has no row in cards.tsv, so nothing says what it is for."
              status=1
            fi
          done

          if [ "$status" -eq 0 ]; then
            echo "Every row has a card and every card has a row."
          fi
          exit $status
